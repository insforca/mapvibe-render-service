# .github/workflows/seed-pbfs-direct.yml
#
# Lightweight seeder: downloads any Geofabrik PBF and uploads it directly to
# the mapvibe-graph-cache R2 bucket using boto3.  No Railway CLI required —
# just three GitHub secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY (same ones the render service uses at runtime).
#
# Usage:
#   Dispatch manually from the Actions tab with a space-separated list of
#   region_key values (must match keys in python/geofabrik_regions.json).
#
# Examples:
#   north-america/us/district-of-columbia north-america/us/maryland
#   south-america/venezuela
#   europe/great-britain/england/greater-london

name: Seed PBFs to R2 (direct)

on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Space-separated region_key values (e.g. 'north-america/us/district-of-columbia')"
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install boto3 requests

      - name: Upload PBFs to R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       mapvibe-graph-cache
          REGION_KEYS:          ${{ github.event.inputs.keys }}
        run: python scripts/upload_pbfs_to_r2.py --keys $REGION_KEYS
