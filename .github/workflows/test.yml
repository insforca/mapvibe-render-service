name: test

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (no scripts — skip native build)
        run: npm install --ignore-scripts

      - name: Fetch the prebuilt canvas binary (font tests draw with real faces)
        run: npm rebuild canvas

      - name: Run unit tests
        run: npm test

  # Editor/render text parity: the studio's check-lockup-parity.cjs compares the
  # studio's lockup code (studio main) with THIS commit's poster text, pixel for
  # pixel (352 typography cases, fades, CSS, credits). Studio is read with
  # PARITY_READ_TOKEN (fine-grained, Contents read-only). Never calls a service.
  lockup-parity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out this repo into render/
        uses: actions/checkout@v4
        with:
          path: render
          persist-credentials: false

      - name: Check the parity token is configured
        env:
          PARITY_READ_TOKEN: ${{ secrets.PARITY_READ_TOKEN }}
        run: |
          if [ -z "$PARITY_READ_TOKEN" ]; then
            echo "::error::PARITY_READ_TOKEN is missing or not available to this run (forks and Dependabot get no secrets). Ask the owner to add or renew it."
            exit 1
          fi

      - name: Check out the studio repo (main) into studio/
        uses: actions/checkout@v4
        with:
          repository: insforca/mapvibe-studio
          ref: main
          path: studio
          token: ${{ secrets.PARITY_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            render/package-lock.json
            studio/package-lock.json

      - name: Install the render canvas (prebuilt binary)
        working-directory: render
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm rebuild canvas

      - name: Install studio dependencies
        working-directory: studio
        run: npm ci

      - name: Lockup parity
        working-directory: studio
        run: |
          node scripts/check-lockup-parity.cjs --fontconfig ../render
          export PANGOCAIRO_BACKEND=fc
          export FONTCONFIG_FILE="$PWD/node_modules/.cache/lockup-fontconfig/fonts.conf"
          node scripts/check-lockup-parity.cjs ../render
