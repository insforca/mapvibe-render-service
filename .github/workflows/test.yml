name: test

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (no scripts — skip native build)
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Python geometry and poster-font tests
        run: |
          python3 -m venv /tmp/pytests
          /tmp/pytests/bin/pip install mapbox-vector-tile==2.2.0 shapely
          /tmp/pytests/bin/python -m unittest discover -s python/tests -v
