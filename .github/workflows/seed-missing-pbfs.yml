# .github/workflows/seed-missing-pbfs.yml
#
# Automatically seeds any Geofabrik PBF regions in geofabrik_regions.json
# that are NOT yet present in R2.  Runs on every push that touches
# python/geofabrik_regions.json so newly-added sub-regions are seeded before
# the next Railway deploy.
#
# After uploading, triggers a Railway redeploy so the startup prebuild
# can extract graphs from the fresh PBFs and warm the L1/L2 graph cache —
# that's the step that makes first previews fast (~3–4 s vs ~25 s cold).
#
# Required GitHub secrets:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   RAILWAY_TOKEN  (for the redeploy trigger)
# Optional:
#   R2_BUCKET_NAME (defaults to mapvibe-graph-cache)

name: Seed missing PBFs to R2

on:
  push:
    branches: [main]
    paths:
      - python/geofabrik_regions.json
  workflow_dispatch:
    inputs:
      priority:
        description: "Max priority to include (1 = P1 only, 2 = P1+P2, 3 = all)"
        required: false
        default: "3"
      max_size_mb:
        description: "Skip regions larger than this (MB, default 500)"
        required: false
        default: "500"
      skip_redeploy:
        description: "Set to 'true' to skip the Railway redeploy after seeding"
        required: false
        default: "false"

jobs:
  seed:
    name: Seed missing PBFs
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Seed missing PBFs to R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME || 'mapvibe-graph-cache' }}
        run: |
          python scripts/upload_pbfs_to_r2.py \
            --resume \
            --priority ${{ inputs.priority || '3' }} \
            --max-size-mb ${{ inputs.max_size_mb || '500' }} \
            --workers 4

      - name: Trigger Railway redeploy (warm prebuild graphs)
        if: ${{ inputs.skip_redeploy != 'true' }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service render --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
